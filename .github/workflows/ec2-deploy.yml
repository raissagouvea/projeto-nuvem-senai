name: Implantação AWS
on:
  workflow_run:
    workflows: ["Builds and Tests"]
    types:
      - completed
  workflow_dispatch:

jobs:
  Deploy:
    name: Deploy via SSH na EC2
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy via SSH na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:latest
            sudo docker stop senai_fastapi 2>/dev/null || true
            sudo docker rm senai_fastapi 2>/dev/null || true
            sudo docker run -d --name senai_fastapi --restart unless-stopped -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:latest
            sleep 5
            curl -f http://localhost:8080/health || exit 1
            echo "Deploy concluído com sucesso!"
            sudo docker image prune -f
